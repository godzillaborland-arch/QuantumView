<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vijayanagara: Stage 1 — The God in Exile (2.5D Isometric)</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Core Libraries -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0d10;
      color: #f0e2c4;
      font-family: 'Figtree', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #root {
      width: 100%;
      height: 100%;
    }

    @keyframes vij-rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    a {
      color: #c8d6ae;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    a:hover {
      color: #e8f0d8;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
    }

    /* --- Tutorial Styles --- */
    #vij-tutorial {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 28%, rgba(198,113,57,.25), rgba(4,5,6,.95) 64%);
      color: #f0e2c4;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    #vij-tutorial * { box-sizing: border-box; }
    #vij-tutorial .vt-card {
      width: min(720px, 100%);
      padding: 30px 32px 24px;
      border-radius: 24px;
      background: rgba(9,11,13,.95);
      border: 1px solid rgba(198,113,57,.6);
      box-shadow: 0 24px 80px rgba(0,0,0,.65);
      animation: vijTutRise .32s ease both;
    }
    #vij-tutorial .vt-eyebrow { font-size: 11px; letter-spacing: .2em; color: #96a08f; text-transform: uppercase; }
    #vij-tutorial .vt-step { margin-top: 8px; font-size: 11px; letter-spacing: .15em; color: #c8d6ae; text-transform: uppercase; }
    #vij-tutorial h2 {
      margin: 8px 0 10px;
      font-family: 'Caprasimo', Georgia, serif;
      font-weight: 400;
      font-size: 34px;
      line-height: 1.12;
      color: #e8a45c;
    }
    #vij-tutorial p { margin: 9px 0; font-size: 15px; line-height: 1.68; color: #d9ceb7; }
    #vij-tutorial strong { color: #f3c078; }
    #vij-tutorial .vt-visual {
      min-height: 104px;
      margin: 18px 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    #vij-tutorial .vt-chip {
      min-width: 130px;
      padding: 12px 14px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid rgba(198,113,57,.48);
      background: rgba(34,27,19,.74);
      color: #f0e2c4;
      font-size: 12px;
      line-height: 1.45;
      letter-spacing: .03em;
    }
    #vij-tutorial .vt-chip small { display: block; margin-top: 3px; color: #9e9582; font-size: 10px; letter-spacing: .02em; }
    #vij-tutorial .vt-chip.gold { border-color: rgba(243,192,120,.68); box-shadow: 0 0 28px rgba(198,113,57,.14); }
    #vij-tutorial .vt-chip.red { border-color: rgba(255,73,55,.68); box-shadow: 0 0 28px rgba(255,73,55,.12); }
    #vij-tutorial .vt-chip.green { border-color: rgba(122,138,94,.72); box-shadow: 0 0 28px rgba(122,138,94,.12); }
    #vij-tutorial .vt-chip.silver { border-color: rgba(200,214,174,.55); }
    #vij-tutorial .vt-key {
      display: inline-block;
      min-width: 30px;
      padding: 6px 8px;
      margin: 2px;
      border-radius: 6px;
      border: 1px solid #806b48;
      background: #191611;
      color: #f3c078;
      box-shadow: inset 0 -2px 0 rgba(255,255,255,.05);
      font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
    }
    #vij-tutorial .vt-route {
      position: relative;
      width: min(510px, 82vw);
      height: 78px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(122,138,94,.5);
      background: linear-gradient(135deg, rgba(91,72,49,.34), rgba(18,22,19,.72));
    }
    #vij-tutorial .vt-route:before, #vij-tutorial .vt-route:after {
      content: "";
      position: absolute;
      height: 10px;
      width: 68%;
      background: #6a5740;
      box-shadow: 0 4px 12px rgba(0,0,0,.35);
    }
    #vij-tutorial .vt-route:before { left: 0; top: 18px; }
    #vij-tutorial .vt-route:after { right: 0; bottom: 18px; }
    #vij-tutorial .vt-arrow { position: absolute; left: 48%; top: 18px; font-size: 36px; color: #c8d6ae; }
    #vij-tutorial .vt-note { font-size: 12px; color: #9f9683; }
    #vij-tutorial .vt-progress { display: flex; justify-content: center; gap: 7px; margin: 14px 0 16px; }
    #vij-tutorial .vt-dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid #806b48; background: transparent; }
    #vij-tutorial .vt-dot.on { background: #e8a45c; border-color: #e8a45c; }
    #vij-tutorial .vt-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    #vij-tutorial button {
      appearance: none;
      cursor: pointer;
      padding: 11px 18px;
      border-radius: 999px;
      border: 1px solid rgba(198,113,57,.72);
      background: #c67139;
      color: #1a1207;
      font: 700 12px/1 system-ui, -apple-system, sans-serif;
      letter-spacing: .1em;
    }
    #vij-tutorial button.secondary {
      background: rgba(9,11,13,.9);
      color: #d7c9aa;
      border-color: rgba(255,255,255,.2);
    }
    #vij-tutorial button:hover { filter: brightness(1.08); }
    #vij-tutorial button:focus-visible { outline: 2px solid #f3c078; outline-offset: 3px; }
    @keyframes vijTutRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (max-width: 700px) {
      #vij-tutorial { padding: 14px; }
      #vij-tutorial .vt-card { padding: 22px 18px 18px; border-radius: 20px; }
      #vij-tutorial h2 { font-size: 27px; }
      #vij-tutorial p { font-size: 14px; line-height: 1.55; }
      #vij-tutorial .vt-visual { min-height: 82px; margin: 12px 0 8px; gap: 8px; }
      #vij-tutorial .vt-chip { min-width: 108px; padding: 10px; font-size: 11px; }
    }
    @media (max-height: 650px) {
      #vij-tutorial { align-items: flex-start; overflow: auto; }
      #vij-tutorial .vt-card { margin: auto 0; padding-top: 18px; padding-bottom: 16px; }
      #vij-tutorial h2 { font-size: 25px; }
      #vij-tutorial p { margin: 6px 0; font-size: 13px; line-height: 1.5; }
      #vij-tutorial .vt-visual { min-height: 60px; margin: 8px 0; }
      #vij-tutorial .vt-progress { margin: 8px 0 10px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- World Coordinates & Isometric Geometry ---
    const WORLD = { w: 920, h: 2600 };
    const ISO_TILE_W = 64;
    const ISO_TILE_H = 32;

    function worldToIso(x, y) {
      return {
        x: ((x - y) / ISO_TILE_W) * (ISO_TILE_W / 2),
        y: ((x + y) / ISO_TILE_H) * (ISO_TILE_H / 2)
      };
    }

    function fillIsoDiamond(ctx, sx, sy, w, h, fillStyle) {
      ctx.fillStyle = fillStyle;
      ctx.beginPath();
      ctx.moveTo(sx, sy - h / 2);
      ctx.lineTo(sx + w / 2, sy);
      ctx.lineTo(sx, sy + h / 2);
      ctx.lineTo(sx - w / 2, sy);
      ctx.closePath();
      ctx.fill();
    }

    const WALLS = [
      [20,100,45,2450], [855,100,45,2450],
      [20,100,300,45], [600,100,300,45],
      [20,2505,350,45], [550,2505,350,45],
      [70,2140,520,35], [330,1810,520,35], [70,1460,520,35], [330,1110,520,35], [70,760,520,35]
    ].map(a => ({ x: a[0], y: a[1], w: a[2], h: a[3] }));

    const SHRINE_SPOTS = [
      { x: 740, y: 2060, name: 'the first lamp' },
      { x: 175, y: 1700, name: 'the pillared lamp' },
      { x: 740, y: 1250, name: 'the inner lamp' },
      { x: 175, y: 880,  name: 'the last lamp' }
    ];

    const GUARD_ROUTES = [
      [{ x: 170, y: 1990 }, { x: 750, y: 1990 }],
      [{ x: 750, y: 1650 }, { x: 175, y: 1650 }],
      [{ x: 170, y: 1300 }, { x: 755, y: 1300 }],
      [{ x: 750, y: 950 },  { x: 170, y: 950 }],
      [{ x: 165, y: 450 },  { x: 760, y: 450 }, { x: 760, y: 640 }, { x: 165, y: 640 }]
    ];

    const TRIGGERS = [
      { y: 2140, text: 'The first courtyard is behind you. They are inside the walls.' },
      { y: 1810, text: 'Cup the flame when they are near. An open lamp is a beacon.' },
      { y: 1460, text: 'Halfway. The inner prakara is watched from both ends.' },
      { y: 1110, text: 'Nearly there. The long court is walked end to end.' },
      { y: 760,  text: 'The south gate. Beyond it the forest — not safe, only unwatched.' }
    ];

    const OBJECTIVES = [
      [2175, 'Cross the first courtyard and find the lamp shrine.'],
      [1845, 'Move through the pillared passage. Keep to the left gap.'],
      [1495, 'Keep the flame alive. Reach the inner gate.'],
      [1145, 'Pass the inner prakara without being seen.'],
      [795,  'One patrol left. It walks the long court end to end.'],
      [0,    'Reach the south gate and the forest beyond.']
    ];

    const DIFF = {
      Pilgrim:   { visionOpen: 205, visionCup: 92,  alertRate: 1.05, drainOpen: 0.36, drainCup: 0.15, guardSpeed: 128, memPenalty: 18, name: 'Pilgrim' },
      Custodian: { visionOpen: 252, visionCup: 118, alertRate: 1.45, drainOpen: 0.50, drainCup: 0.20, guardSpeed: 150, memPenalty: 25, name: 'Custodian' },
      Guardian:  { visionOpen: 292, visionCup: 140, alertRate: 1.85, drainOpen: 0.62, drainCup: 0.25, guardSpeed: 172, memPenalty: 34, name: 'Guardian' }
    };

    const TUTORIAL_SCREENS = [
      {
        title: "Carry Sri Namperumal to Safety",
        body: '<p>Srirangam is under attack. You are a temple custodian carrying <strong>Sri Namperumal</strong> — the processional form of Sri Ranganatha — toward the south gate.</p><p>Cross the courtyards, protect the ceremonial flame, keep the chain of custody intact, and reach the forest.</p>',
        visual: '<div class="vt-chip gold">SRI NAMPERUMAL<small>Carry the sacred image</small></div><div style="font-size:26px;color:#e8a45c">→</div><div class="vt-chip green">SOUTH GATE<small>Reach the forest beyond</small></div>'
      },
      {
        title: "Move Through the Temple",
        body: '<p><strong>Desktop:</strong> use WASD or the arrow keys. <strong>Phone/tablet:</strong> use the joystick.</p><p>The route zig-zags through alternating courtyards and stone barriers. Follow each opening rather than trying to move straight ahead.</p>',
        visual: '<div><span class="vt-key">W</span><br><span class="vt-key">A</span><span class="vt-key">S</span><span class="vt-key">D</span></div><div style="font-size:20px;color:#8f8674">or</div><div><span class="vt-key">↑</span><br><span class="vt-key">←</span><span class="vt-key">↓</span><span class="vt-key">→</span></div>'
      },
      {
        title: "Open the Flame — or Cup It",
        body: '<p>An <strong>open flame</strong> lights a larger area and lets you move normally, but patrols can detect it from farther away.</p><p>Near a guard, <strong>cup the flame</strong>: hold <strong>SHIFT</strong>, press <strong>C</strong> to lock/unlock it, or hold <strong>CUP FLAME</strong> on mobile. You become much harder to detect — but you move slowly.</p>',
        visual: '<div class="vt-chip gold">🔥 FLAME OPEN<small>More light · more visible</small></div><div style="font-size:24px;color:#8f8674">⇄</div><div class="vt-chip green">◐ FLAME CUPPED<small>Less visible · slower</small></div><div class="vt-chip red">● PATROLS<small>Watch their direction</small></div>'
      },
      {
        title: "Protect Flame & Memory",
        body: '<p><strong>FLAME</strong> drains as you move. Touch one of the four glowing lamp shrines to feed it.</p><p><strong>MEMORY</strong> measures the continuity of custody. If a patrol catches the procession, Memory falls and the flame is damaged. Each lamp shrine also saves a <strong>checkpoint</strong>, so you can resume from remembered ground.</p>',
        visual: '<div class="vt-chip gold">🔥 FLAME<small>Lamp shrines restore it</small></div><div class="vt-chip silver">◇ MEMORY<small>Avoid repeated detection</small></div><div class="vt-chip green">↺ CHECKPOINT<small>Saved at each lamp shrine</small></div>'
      },
      {
        title: "Reach the Forest — Choose Your Challenge",
        body: '<p>Follow the objectives through the final courtyard and pass through the central opening at the south gate.</p><p>On the next screen choose your challenge: <strong>Pilgrim</strong> is forgiving, <strong>Custodian</strong> is the intended balance, and <strong>Guardian</strong> is unforgiving.</p>',
        visual: '<div class="vt-route"><div class="vt-arrow">↑</div></div><div class="vt-chip">PILGRIM<small>Forgiving</small></div><div class="vt-chip gold">CUSTODIAN<small>Balanced</small></div><div class="vt-chip red">GUARDIAN<small>Unforgiving</small></div>',
        note: 'Lamp shrines create checkpoints. If a run breaks, you can resume from the latest shrine on the level-selection screen.'
      }
    ];

    const TAU = Math.PI * 2;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const rand = (a, b) => a + Math.random() * (b - a);
    function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
    function pointInRect(x, y, o) { return x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h; }

    function VijayanagaraStage1() {
      const canvasRef = useRef(null);
      const joyRef = useRef(null);

      // React UI States
      const [phase, setPhase] = useState('intro');
      const [showTutorial, setShowTutorial] = useState(true);
      const [tutorialIndex, setTutorialIndex] = useState(0);

      const [flame, setFlame] = useState(100);
      const [memory, setMemory] = useState(100);
      const [stealth, setStealth] = useState(false);
      const [objective, setObjective] = useState(OBJECTIVES[0][1]);
      const [message, setMessage] = useState('');
      const [messageOn, setMessageOn] = useState(false);
      const [soundOn, setSoundOn] = useState(true);
      const [hasCheckpoint, setHasCheckpoint] = useState(false);
      const [checkpointLabel, setCheckpointLabel] = useState('');
      const [isTouch, setIsTouch] = useState(false);
      const [nubPos, setNubPos] = useState({ x: 0, y: 0 });
      const [won, setWon] = useState(false);
      const [endState, setEndState] = useState({ kicker: '', title: '', body: '', action: 'RESTART' });

      // Engine Mutable State
      const eng = useRef({
        keys: {},
        joy: { x: 0, y: 0 },
        cupTouch: false,
        cupLock: false,
        particles: [],
        D: DIFF.Custodian,
        flameVal: 100,
        memoryVal: 100,
        stun: 0,
        grace: 0,
        flash: 0,
        msgTimer: 0,
        hudTimer: 0,
        bandIndex: -1,
        playing: false,
        player: { x: 460, y: 2440, r: 17, dir: -Math.PI / 2 },
        shrines: [],
        guards: [],
        triggers: [],
        checkpoint: null,
        audioCtx: null,
        master: null,
        nextBell: 0,
        lastStep: 0,
        lastFlameBand: 5
      });

      // Canvas buffers
      const gfx = useRef({
        ctx: null,
        lightCanvas: null,
        lightCtx: null,
        W: 800,
        H: 600,
        dpr: 1
      });

      const say = (text, secs = 2.4) => {
        eng.current.msgTimer = secs;
        setMessage(text);
        setMessageOn(true);
      };

      // --- Sound Synthesizer (Web Audio API) ---
      const ensureAudio = () => {
        const e = eng.current;
        if (e.audioCtx) {
          if (e.audioCtx.state === 'suspended') e.audioCtx.resume();
          return;
        }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        const master = ctx.createGain();
        master.gain.value = soundOn ? 0.22 : 0;
        master.connect(ctx.destination);

        const drone = ctx.createOscillator();
        const dg = ctx.createGain();
        drone.type = 'sine';
        drone.frequency.value = 96;
        dg.gain.value = 0.02;
        drone.connect(dg).connect(master);

        const lfo = ctx.createOscillator();
        const lg = ctx.createGain();
        lfo.type = 'sine';
        lfo.frequency.value = 0.17;
        lg.gain.value = 0.011;
        lfo.connect(lg).connect(dg.gain);

        drone.start();
        lfo.start();

        e.audioCtx = ctx;
        e.master = master;
        e.nextBell = ctx.currentTime + 4;
      };

      const tone = (freq, dur, type = 'sine', gain = 0.05, delay = 0) => {
        const e = eng.current;
        if (!e.audioCtx || !soundOn) return;
        const t = e.audioCtx.currentTime + delay;
        const osc = e.audioCtx.createOscillator();
        const g = e.audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g).connect(e.master);
        osc.start(t);
        osc.stop(t + dur + 0.04);
      };

      const bell = (f, g) => {
        tone(f, 1.4, 'sine', g);
        tone(f * 2.01, 1.1, 'sine', g * 0.45, 0.02);
        tone(f * 2.99, 0.9, 'sine', g * 0.22, 0.03);
      };

      const toggleSound = () => {
        ensureAudio();
        const next = !soundOn;
        setSoundOn(next);
        const e = eng.current;
        if (e.master && e.audioCtx) {
          e.master.gain.cancelScheduledValues(e.audioCtx.currentTime);
          e.master.gain.linearRampToValueAtTime(next ? 0.22 : 0, e.audioCtx.currentTime + 0.08);
        }
      };

      // --- Initialization & Resets ---
      const resetGame = (fromCheckpoint = false) => {
        const e = eng.current;
        const cp = fromCheckpoint ? e.checkpoint : null;
        e.player = { x: cp ? cp.x : 460, y: cp ? cp.y : 2440, r: 17, dir: -Math.PI / 2 };
        e.flameVal = cp ? cp.flame : 100;
        e.memoryVal = cp ? cp.memory : 100;
        e.shrines = SHRINE_SPOTS.map((s, i) => ({ x: s.x, y: s.y, name: s.name, used: cp ? i <= cp.shrine : false }));
        e.guards = GUARD_ROUTES.map(route => ({
          route,
          wp: 1,
          x: route[0].x,
          y: route[0].y,
          face: Math.atan2(route[1].y - route[0].y, route[1].x - route[0].x),
          alert: 0,
          mode: 'patrol',
          wait: 0,
          lost: 0,
          lastSeen: null
        }));
        e.triggers = TRIGGERS.map(t => ({ y: t.y, text: t.text, fired: cp ? t.y >= cp.y : false }));
        e.particles = [];
        e.stun = 0;
        e.grace = 1.2;
        e.flash = 0;
        e.bandIndex = -1;
        e.cupLock = false;

        setFlame(e.flameVal);
        setMemory(e.memoryVal);
        setStealth(false);
      };

      const beginStage = (diffKey, fromCheckpoint = false) => {
        ensureAudio();
        const e = eng.current;
        e.D = DIFF[diffKey] || DIFF.Custodian;
        resetGame(fromCheckpoint);
        e.playing = true;
        setPhase('playing');
        bell(523.25, 0.032);
        say(fromCheckpoint ? 'The lamp is lit again. Move.' : 'Carry the sacred. Move in silence.', 2.6);
      };

      const saveCheckpoint = (index) => {
        const e = eng.current;
        const data = {
          shrine: index,
          x: e.shrines[index].x,
          y: e.shrines[index].y,
          flame: e.flameVal,
          memory: e.memoryVal,
          label: e.shrines[index].name,
          diff: e.D.name
        };
        e.checkpoint = data;
        try { window.localStorage.setItem('vij_stage1_checkpoint', JSON.stringify(data)); } catch (err) {}
        setHasCheckpoint(true);
        setCheckpointLabel(data.label.toUpperCase());
      };

      // --- Collision & Raycast Line of Sight ---
      const blocked = (x, y) => {
        if (x < 75 || x > 845 || y < 118 || y > 2520) return true;
        const r = eng.current.player.r;
        for (const o of WALLS) {
          const nx = clamp(x, o.x, o.x + o.w);
          const ny = clamp(y, o.y, o.y + o.h);
          const dx = x - nx;
          const dy = y - ny;
          if (dx * dx + dy * dy < r * r) return true;
        }
        return false;
      };

      const lineOfSight = (ax, ay, bx, by) => {
        const dx = bx - ax, dy = by - ay;
        const steps = Math.ceil(Math.hypot(dx, dy) / 22);
        for (let i = 1; i < steps; i++) {
          const t = i / steps;
          const px = ax + dx * t;
          const py = ay + dy * t;
          for (const o of WALLS) {
            if (pointInRect(px, py, o)) return false;
          }
        }
        return true;
      };

      const finish = (isWon, reason) => {
        const e = eng.current;
        e.playing = false;
        if (isWon) {
          [392, 523.25, 659.25, 783.99].forEach((f, i) => tone(f, 0.42, 'sine', 0.042, i * 0.16));
          tone(1046.5, 1.2, 'sine', 0.035, 0.76);
          try { window.localStorage.removeItem('vij_stage1_checkpoint'); } catch (err) {}
          setWon(true);
          setEndState({
            kicker: 'STAGE 1 COMPLETE',
            title: 'The Deity Is Safe',
            body: 'You are past the south gate with Sri Namperumal intact and the flame still burning. The destination is not yet visible. The direction is clear.',
            action: 'PLAY AGAIN'
          });
        } else {
          [330, 294, 247, 196].forEach((f, i) => tone(f, 0.5, 'sine', 0.05, i * 0.2));
          setWon(false);
          setEndState({
            kicker: 'THE PROCESSION BREAKS',
            title: reason === 'flame' ? 'The Flame Went Out' : 'The Custody Is Broken',
            body: reason === 'flame'
              ? 'The lamp guttered out in the dark and the procession lost its way. Feed the flame at every shrine you pass — and cup it only when you must, because cupping is slow.'
              : 'Too many hands found the palanquin. What breaks is not the bronze but the continuity of custody. Use the walls, and let patrols turn away before you cross behind them.',
            action: 'TRY AGAIN'
          });
        }
        setPhase('end');
      };

      const caught = () => {
        const e = eng.current;
        e.memoryVal = Math.max(0, e.memoryVal - e.D.memPenalty);
        e.flameVal = Math.max(6, e.flameVal - 12);
        e.stun = 1.1;
        e.grace = 3.2;
        e.flash = 1;
        tone(146, 0.3, 'sawtooth', 0.07);
        tone(110, 0.45, 'sawtooth', 0.06, 0.1);

        for (let i = 0; i < 26; i++) {
          const a = rand(0, TAU), sp = rand(30, 190);
          e.particles.push({ x: e.player.x, y: e.player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.35, 0.8), max: 0.8, color: '#ff4937' });
        }

        say('Hands on the palanquin — the procession falters.', 2.4);
        for (const g of e.guards) {
          g.mode = 'investigate';
          g.alert = 0.25;
          g.lastSeen = { x: e.player.x + rand(-90, 90), y: e.player.y + rand(40, 150) };
          g.wait = 2.4;
        }

        setMemory(e.memoryVal);
        setFlame(e.flameVal);
        if (e.memoryVal <= 0) finish(false, 'memory');
      };

      // --- Main Simulation Update ---
      const update = (dt) => {
        const e = eng.current;
        if (e.msgTimer > 0) {
          e.msgTimer -= dt;
          if (e.msgTimer <= 0) setMessageOn(false);
        }
        if (e.flash > 0) e.flash = Math.max(0, e.flash - dt * 1.6);

        // Particle dynamics
        for (let i = e.particles.length - 1; i >= 0; i--) {
          const p = e.particles[i];
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.93;
          p.vy *= 0.93;
          if (p.life <= 0) e.particles.splice(i, 1);
        }

        if (!e.playing) return;

        const cupped = !!(e.keys.ShiftLeft || e.keys.ShiftRight || e.keys.Shift || e.cupLock || e.cupTouch);
        if (e.grace > 0) e.grace -= dt;

        if (e.stun > 0) {
          e.stun -= dt;
        } else {
          let ix = (e.keys.KeyD || e.keys.ArrowRight ? 1 : 0) - (e.keys.KeyA || e.keys.ArrowLeft ? 1 : 0) + e.joy.x;
          let iy = (e.keys.KeyS || e.keys.ArrowDown ? 1 : 0) - (e.keys.KeyW || e.keys.ArrowUp ? 1 : 0) + e.joy.y;
          const len = Math.hypot(ix, iy);

          if (len > 0.06) {
            ix /= len;
            iy /= len;
            const sp = 182 * (cupped ? 0.56 : 1);
            const nx = e.player.x + ix * sp * dt;
            const ny = e.player.y + iy * sp * dt;
            if (!blocked(nx, e.player.y)) e.player.x = nx;
            if (!blocked(e.player.x, ny)) e.player.y = ny;
            e.player.dir = Math.atan2(iy, ix);
            e.flameVal -= dt * (cupped ? e.D.drainCup : e.D.drainOpen);

            if (e.audioCtx && soundOn && e.audioCtx.currentTime - e.lastStep > (cupped ? 0.5 : 0.33)) {
              tone(120, 0.06, 'triangle', 0.016);
              tone(85, 0.05, 'sine', 0.011, 0.008);
              e.lastStep = e.audioCtx.currentTime;
            }
          } else {
            e.flameVal -= dt * (cupped ? 0.06 : 0.14);
          }
        }

        // Ambient Bells & Warnings
        if (e.audioCtx && soundOn) {
          if (e.audioCtx.currentTime >= e.nextBell) {
            bell(660 + Math.random() * 70, 0.026);
            e.nextBell = e.audioCtx.currentTime + 8 + Math.random() * 6;
          }
          const band = e.flameVal < 20 ? 1 : e.flameVal < 35 ? 2 : e.flameVal < 50 ? 3 : 5;
          if (band < e.lastFlameBand) {
            tone(320, 0.09, 'triangle', 0.024);
            tone(285, 0.09, 'triangle', 0.02, 0.11);
            e.lastFlameBand = band;
          } else if (band > e.lastFlameBand) {
            e.lastFlameBand = band;
          }
        }

        // Shrine Interactions
        for (let i = 0; i < e.shrines.length; i++) {
          const s = e.shrines[i];
          if (!s.used && Math.hypot(e.player.x - s.x, e.player.y - s.y) < 52) {
            s.used = true;
            e.flameVal = Math.min(100, e.flameVal + 40);
            tone(523.25, 0.18, 'sine', 0.045);
            tone(659.25, 0.22, 'sine', 0.04, 0.08);
            tone(783.99, 0.32, 'sine', 0.035, 0.15);

            for (let k = 0; k < 22; k++) {
              const a = rand(0, TAU), sp = rand(30, 190);
              e.particles.push({ x: s.x, y: s.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.35, 0.8), max: 0.8, color: '#f3c078' });
            }
            saveCheckpoint(i);
            say('Lamp shrine — the flame is fed. This ground is remembered.', 2.6);
          }
        }

        // Guards Update
        for (const g of e.guards) {
          const range = (cupped ? e.D.visionCup : e.D.visionOpen) * 0.95;
          const d = Math.hypot(e.player.x - g.x, e.player.y - g.y);
          const toPlayer = Math.atan2(e.player.y - g.y, e.player.x - g.x);
          const hearRange = cupped ? 34 : 62;
          let sees = false;

          if (e.grace <= 0) {
            if (d < hearRange) sees = true;
            else if (d < range && Math.abs(angDiff(toPlayer, g.face)) < 0.62 && lineOfSight(g.x, g.y, e.player.x, e.player.y)) sees = true;
          }

          if (sees) g.alert = Math.min(1, g.alert + dt * e.D.alertRate * (cupped ? 0.6 : 1));
          else g.alert = Math.max(0, g.alert - dt * 0.55);

          if (g.alert >= 1 && g.mode !== 'chase') {
            g.mode = 'chase';
            g.lost = 0;
            tone(220, 0.11, 'sawtooth', 0.06);
            tone(196, 0.11, 'sawtooth', 0.055, 0.12);
            tone(174, 0.2, 'sawtooth', 0.05, 0.24);
            say('Seen. Hooves on the flagstones.', 2);
            for (const o of e.guards) {
              if (o !== g && Math.hypot(o.x - g.x, o.y - g.y) < 430) o.alert = Math.max(o.alert, 0.55);
            }
          } else if (g.mode === 'patrol' && g.alert > 0.32) {
            g.mode = 'suspicious';
            g.wait = 1.5;
            tone(330, 0.14, 'triangle', 0.03);
            tone(392, 0.16, 'triangle', 0.026, 0.13);
          }

          const speed = e.D.guardSpeed;
          if (g.mode === 'patrol') {
            const tgt = g.route[g.wp];
            const a = Math.atan2(tgt.y - g.y, tgt.x - g.x);
            g.x += Math.cos(a) * speed * 0.42 * dt;
            g.y += Math.sin(a) * speed * 0.42 * dt;
            g.face = a;
            if (Math.hypot(tgt.x - g.x, tgt.y - g.y) < 12) g.wp = (g.wp + 1) % g.route.length;
          } else if (g.mode === 'suspicious') {
            g.face += angDiff(toPlayer, g.face) * Math.min(1, dt * 3.4);
            g.wait -= dt;
            if (g.alert <= 0.06 || g.wait <= 0) {
              g.mode = 'patrol';
              g.alert = Math.min(g.alert, 0.2);
            }
          } else if (g.mode === 'chase') {
            if (sees) {
              g.lastSeen = { x: e.player.x, y: e.player.y };
              g.lost = 0;
            } else {
              g.lost += dt;
            }
            const tgt = g.lastSeen || e.player;
            const a = Math.atan2(tgt.y - g.y, tgt.x - g.x);
            g.x += Math.cos(a) * speed * dt;
            g.y += Math.sin(a) * speed * dt;
            g.face = a;
            if (d < 30 && e.grace <= 0) caught();
            if (g.lost > 2.2) {
              g.mode = 'investigate';
              g.wait = 2;
              g.alert = 0.3;
            }
          } else if (g.mode === 'investigate') {
            const tgt = g.lastSeen;
            if (tgt && Math.hypot(tgt.x - g.x, tgt.y - g.y) > 16) {
              const a = Math.atan2(tgt.y - g.y, tgt.x - g.x);
              g.x += Math.cos(a) * speed * 0.6 * dt;
              g.y += Math.sin(a) * speed * 0.6 * dt;
              g.face = a;
            } else {
              g.face += dt * 1.5;
              g.wait -= dt;
              if (g.wait <= 0) {
                g.mode = 'patrol';
                g.alert = 0;
                g.lastSeen = null;
                let best = 0, bd = 1e9;
                for (let k = 0; k < g.route.length; k++) {
                  const dd = Math.hypot(g.route[k].x - g.x, g.route[k].y - g.y);
                  if (dd < bd) { bd = dd; best = k; }
                }
                g.wp = best;
              }
            }
          }
        }

        // Narrative Triggers
        for (const t of e.triggers) {
          if (!t.fired && e.player.y < t.y) {
            t.fired = true;
            say(t.text, 3.2);
          }
        }

        // Progress Bar
        let band = OBJECTIVES.length - 1;
        for (let i = 0; i < OBJECTIVES.length; i++) {
          if (e.player.y >= OBJECTIVES[i][0]) {
            band = i;
            break;
          }
        }
        if (band !== e.bandIndex) {
          e.bandIndex = band;
          setObjective(OBJECTIVES[band][1]);
        }

        if (e.flameVal <= 0) return finish(false, 'flame');
        if (e.memoryVal <= 0) return finish(false, 'memory');
        if (e.player.y < 175 && e.player.x > 330 && e.player.x < 590) return finish(true);

        e.hudTimer -= dt;
        if (e.hudTimer <= 0) {
          e.hudTimer = 0.1;
          setFlame(Math.max(0, e.flameVal));
          setMemory(Math.max(0, e.memoryVal));
          setStealth(cupped);
        }
      };

      // --- 2.5D Isometric Rendering Pipeline ---
      const draw = () => {
        const { ctx, lightCtx, lightCanvas, W, H, dpr } = gfx.current;
        if (!ctx) return;
        const e = eng.current;
        const cupped = stealth;
        const t = performance.now();

        // 1. Isometric Camera Positioning
        const pIso = worldToIso(e.player.x, e.player.y);
        const cm = {
          x: pIso.x - W / 2,
          y: pIso.y - H * 0.6
        };

        // 2. Void Background
        ctx.fillStyle = '#0b0d10';
        ctx.fillRect(0, 0, W, H);

        // 3. Isometric Flagstone Ground Mesh
        const step = 60;
        for (let wy = 120; wy < 2520; wy += step) {
          for (let wx = 80; wx < 840; wx += step) {
            const p = worldToIso(wx, wy);
            const sx = p.x - cm.x;
            const sy = p.y - cm.y;
            if (sx < -80 || sx > W + 80 || sy < -80 || sy > H + 80) continue;

            fillIsoDiamond(ctx, sx, sy, ISO_TILE_W, ISO_TILE_H, 'rgba(58,49,36,0.85)');
            ctx.strokeStyle = 'rgba(210,182,138,0.08)';
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }

        // 4. Conical Vision Beams (Projected Flat on Ground Before Y-Sorting)
        for (const g of e.guards) {
          const gp = worldToIso(g.x, g.y);
          const sx = gp.x - cm.x;
          const sy = gp.y - cm.y;
          const range = (cupped ? e.D.visionCup : e.D.visionOpen) * 0.95;
          const fov = 0.62;

          // Trace projected ground cone
          const coneSteps = 16;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          for (let i = 0; i <= coneSteps; i++) {
            const angle = (g.face - fov) + (fov * 2 * (i / coneSteps));
            const rayWx = g.x + Math.cos(angle) * range;
            const rayWy = g.y + Math.sin(angle) * range;
            const rayIso = worldToIso(rayWx, rayWy);
            ctx.lineTo(rayIso.x - cm.x, rayIso.y - cm.y);
          }
          ctx.closePath();

          // Alert-reactive fill
          const coneColor = g.mode === 'chase' 
            ? 'rgba(255, 73, 55, 0.28)' 
            : g.mode === 'suspicious' 
              ? 'rgba(255, 154, 60, 0.22)' 
              : 'rgba(243, 192, 120, 0.12)';
          ctx.fillStyle = coneColor;
          ctx.fill();

          // Crisp perimeter line
          ctx.strokeStyle = g.mode === 'chase' 
            ? 'rgba(255, 73, 55, 0.8)' 
            : g.mode === 'suspicious' 
              ? 'rgba(255, 154, 60, 0.65)' 
              : 'rgba(243, 192, 120, 0.35)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Circular Alert Ring Above Guard
          if (g.alert > 0.05 && g.mode !== 'chase') {
            ctx.strokeStyle = 'rgba(255, 154, 60, 0.85)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(sx, sy - 45, 14, -Math.PI / 2, -Math.PI / 2 + TAU * g.alert);
            ctx.stroke();
          }
        }

        // 5. Build Y-Sorted Render Queue
        const renderQueue = [];

        // Walls
        for (const o of WALLS) {
          renderQueue.push({ type: 'wall', sortY: o.y + o.h, obj: o });
        }

        // Granite Pillars
        for (let y = 2260; y > 260; y -= 175) {
          renderQueue.push({ type: 'pillar', sortY: y, x: 105, y });
          renderQueue.push({ type: 'pillar', sortY: y, x: 815, y });
        }

        // Shrines
        for (const s of e.shrines) {
          renderQueue.push({ type: 'shrine', sortY: s.y, obj: s });
        }

        // Guards
        for (const g of e.guards) {
          renderQueue.push({ type: 'guard', sortY: g.y, obj: g });
        }

        // Player (Custodian + Sri Namperumal)
        renderQueue.push({ type: 'player', sortY: e.player.y, obj: e.player });

        // Sort back-to-front
        renderQueue.sort((a, b) => a.sortY - b.sortY);

        // 6. Render Ordered Entities
        for (const item of renderQueue) {
          switch (item.type) {
            case 'wall': {
              const o = item.obj;
              const p1 = worldToIso(o.x, o.y);
              const p2 = worldToIso(o.x + o.w, o.y);
              const p3 = worldToIso(o.x + o.w, o.y + o.h);
              const p4 = worldToIso(o.x, o.y + o.h);

              const h3D = 38;
              const sx1 = p1.x - cm.x, sy1 = p1.y - cm.y;
              const sx2 = p2.x - cm.x, sy2 = p2.y - cm.y;
              const sx3 = p3.x - cm.x, sy3 = p3.y - cm.y;
              const sx4 = p4.x - cm.x, sy4 = p4.y - cm.y;

              // Shadow
              ctx.fillStyle = 'rgba(0,0,0,0.35)';
              ctx.beginPath();
              ctx.moveTo(sx1 + 8, sy1 + 8);
              ctx.lineTo(sx2 + 8, sy2 + 8);
              ctx.lineTo(sx3 + 8, sy3 + 8);
              ctx.lineTo(sx4 + 8, sy4 + 8);
              ctx.closePath();
              ctx.fill();

              // Extruded Left & Right Faces
              ctx.fillStyle = '#6b573e';
              ctx.beginPath();
              ctx.moveTo(sx4, sy4);
              ctx.lineTo(sx3, sy3);
              ctx.lineTo(sx3, sy3 - h3D);
              ctx.lineTo(sx4, sy4 - h3D);
              ctx.closePath();
              ctx.fill();

              ctx.fillStyle = '#826b4c';
              ctx.beginPath();
              ctx.moveTo(sx1, sy1);
              ctx.lineTo(sx4, sy4);
              ctx.lineTo(sx4, sy4 - h3D);
              ctx.lineTo(sx1, sy1 - h3D);
              ctx.closePath();
              ctx.fill();

              // Top Face
              ctx.fillStyle = '#9c8260';
              ctx.beginPath();
              ctx.moveTo(sx1, sy1 - h3D);
              ctx.lineTo(sx2, sy2 - h3D);
              ctx.lineTo(sx3, sy3 - h3D);
              ctx.lineTo(sx4, sy4 - h3D);
              ctx.closePath();
              ctx.fill();
              ctx.strokeStyle = '#e4bc66';
              ctx.lineWidth = 1;
              ctx.stroke();
              break;
            }

            case 'pillar': {
              const p = worldToIso(item.x, item.y);
              const sx = p.x - cm.x, sy = p.y - cm.y;
              const h3D = 48;

              // Footprint
              ctx.fillStyle = 'rgba(0,0,0,0.4)';
              ctx.beginPath();
              ctx.ellipse(sx, sy, 14, 7, 0, 0, TAU);
              ctx.fill();

              // Shaft
              ctx.fillStyle = '#6d5842';
              ctx.fillRect(sx - 5, sy - h3D, 10, h3D);

              // Carved Capitals
              ctx.fillStyle = '#8a7052';
              ctx.fillRect(sx - 8, sy - h3D - 4, 16, 6);
              ctx.fillRect(sx - 8, sy - 4, 16, 6);
              break;
            }

            case 'shrine': {
              const s = item.obj;
              const p = worldToIso(s.x, s.y);
              const sx = p.x - cm.x, sy = p.y - cm.y;

              fillIsoDiamond(ctx, sx, sy, 36, 18, '#5a4733');

              ctx.fillStyle = '#8a6a3c';
              ctx.beginPath();
              ctx.moveTo(sx, sy - 42);
              ctx.lineTo(sx - 14, sy - 10);
              ctx.lineTo(sx + 14, sy - 10);
              ctx.closePath();
              ctx.fill();

              ctx.fillStyle = s.used ? '#584f42' : '#ffc768';
              ctx.beginPath();
              ctx.arc(sx, sy - 20, 5, 0, TAU);
              ctx.fill();
              break;
            }

            case 'guard': {
              const g = item.obj;
              const p = worldToIso(g.x, g.y);
              const sx = p.x - cm.x, sy = p.y - cm.y;
              const h3D = 32;

              ctx.fillStyle = 'rgba(0,0,0,0.45)';
              ctx.beginPath();
              ctx.ellipse(sx, sy, 12, 6, 0, 0, TAU);
              ctx.fill();

              ctx.fillStyle = '#343b3d';
              ctx.fillRect(sx - 7, sy - h3D, 14, h3D);
              ctx.beginPath();
              ctx.arc(sx, sy - h3D - 6, 7, 0, TAU);
              ctx.fill();

              if (g.mode === 'chase') {
                ctx.fillStyle = '#ff4937';
                ctx.font = 'bold 18px Georgia';
                ctx.fillText('!', sx - 4, sy - h3D - 18);
              } else if (g.mode === 'suspicious') {
                ctx.fillStyle = '#ff9a3c';
                ctx.font = 'bold 16px Georgia';
                ctx.fillText('?', sx - 4, sy - h3D - 18);
              }
              break;
            }

            case 'player': {
              const p = worldToIso(e.player.x, e.player.y);
              const sx = p.x - cm.x, sy = p.y - cm.y;
              const h3D = 28;

              // Contact Shadow
              ctx.fillStyle = 'rgba(0,0,0,0.5)';
              ctx.beginPath();
              ctx.ellipse(sx, sy, 16, 8, 0, 0, TAU);
              ctx.fill();

              // Custodian Body
              ctx.fillStyle = '#c5793c';
              ctx.fillRect(sx - 6, sy - h3D, 12, h3D);
              ctx.beginPath();
              ctx.arc(sx, sy - h3D - 5, 7, 0, TAU);
              ctx.fill();

              // Sri Namperumal Palanquin
              ctx.fillStyle = '#9c8260';
              ctx.fillRect(sx - 16, sy - h3D - 28, 32, 20);
              ctx.strokeStyle = '#e4bc66';
              ctx.lineWidth = 1.5;
              ctx.strokeRect(sx - 16, sy - h3D - 28, 32, 20);

              // Lamp Flame
              const flick = 0.8 + Math.sin(t / 90) * 0.2;
              ctx.fillStyle = cupped ? 'rgba(198,113,57,0.9)' : '#ffd489';
              ctx.beginPath();
              ctx.arc(sx + 10, sy - 8, (cupped ? 2.5 : 4.5) * flick, 0, TAU);
              ctx.fill();
              break;
            }
          }
        }

        // 7. South Gate Exit Marker
        if (e.player.y < 720) {
          const ep = worldToIso(460, 140);
          const ex = ep.x - cm.x, ey = ep.y - cm.y;
          ctx.fillStyle = 'rgba(232,195,106,0.3)';
          ctx.fillRect(ex - 60, ey - 8, 120, 16);
          ctx.fillStyle = '#e8c36a';
          ctx.font = 'bold 15px Georgia';
          ctx.textAlign = 'center';
          ctx.fillText('SOUTH GATE', ex, ey - 20);
          ctx.font = 'bold 24px Georgia';
          ctx.fillText('↑', ex, ey + 6);
        }

        // 8. Particles Pass
        for (const p of e.particles) {
          const a = clamp(p.life / p.max, 0, 1);
          const iso = worldToIso(p.x, p.y);
          ctx.globalAlpha = a;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(iso.x - cm.x, iso.y - cm.y, 2.4, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // 9. Squashed 2.5D Isometric Lighting Mask
        const lx = lightCtx;
        lx.setTransform(dpr, 0, 0, dpr, 0, 0);
        lx.clearRect(0, 0, W, H);
        lx.fillStyle = 'rgba(5,7,9,0.72)';
        lx.fillRect(0, 0, W, H);
        lx.globalCompositeOperation = 'destination-out';

        const punchIsoLight = (wx, wy, radius, strength) => {
          const lp = worldToIso(wx, wy);
          const sx = lp.x - cm.x;
          const sy = lp.y - cm.y;

          lx.save();
          lx.translate(sx, sy);
          lx.scale(1, 0.5);

          const g = lx.createRadialGradient(0, 0, 2, 0, 0, radius);
          g.addColorStop(0, `rgba(255,255,255,${strength})`);
          g.addColorStop(0.65, `rgba(255,255,255,${strength * 0.95})`);
          g.addColorStop(1, 'rgba(255,255,255,0)');

          lx.fillStyle = g;
          lx.beginPath();
          lx.arc(0, 0, radius, 0, TAU);
          lx.fill();
          lx.restore();
        };

        const flick = 0.94 + Math.sin(t / 110) * 0.06;
        const pr = (cupped ? 110 : 230) * flick;

        punchIsoLight(e.player.x, e.player.y, pr, cupped ? 0.8 : 1);

        for (const s of e.shrines) {
          punchIsoLight(s.x, s.y, s.used ? 50 : 120, s.used ? 0.4 : 0.85);
        }

        for (const g of e.guards) {
          punchIsoLight(g.x, g.y, 80, 0.7);
        }

        if (e.player.y < 720) {
          punchIsoLight(460, 150, 180, 0.6);
        }

        lx.globalCompositeOperation = 'source-over';
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(lightCanvas, 0, 0);
        ctx.restore();

        // 10. Damage Flash
        if (e.flash > 0) {
          ctx.fillStyle = `rgba(255,73,55,${e.flash * 0.3})`;
          ctx.fillRect(0, 0, W, H);
        }
      };

      // --- Lifecycle & Game Loop ---
      useEffect(() => {
        let touch = false;
        try { touch = window.matchMedia('(hover: none) and (pointer: coarse)').matches; } catch (err) {}
        setIsTouch(touch);

        let cp = null;
        try {
          const raw = window.localStorage.getItem('vij_stage1_checkpoint');
          if (raw) cp = JSON.parse(raw);
        } catch (err) {}
        eng.current.checkpoint = cp;
        if (cp) {
          setHasCheckpoint(true);
          setCheckpointLabel(cp.label.toUpperCase());
        }

        resetGame(false);

        const onKeyDown = (e) => {
          ensureAudio();
          eng.current.keys[e.code] = true;
          if (e.key === 'Shift') eng.current.keys.Shift = true;
          if (e.code === 'KeyC' && !e.repeat) {
            eng.current.cupLock = !eng.current.cupLock;
            say(eng.current.cupLock ? 'Flame cupped — press C to open it again.' : 'Flame opened.', 1.5);
          }
          if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','ShiftLeft'].indexOf(e.code) >= 0) {
            e.preventDefault();
          }
        };

        const onKeyUp = (e) => {
          eng.current.keys[e.code] = false;
          if (e.key === 'Shift') eng.current.keys.Shift = false;
        };

        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);

        const handleResize = () => {
          if (!canvasRef.current) return;
          const r = canvasRef.current.getBoundingClientRect();
          const W = Math.max(320, Math.round(r.width));
          const H = Math.max(320, Math.round(r.height));
          const dpr = Math.min(window.devicePixelRatio || 1, 2);

          canvasRef.current.width = Math.round(W * dpr);
          canvasRef.current.height = Math.round(H * dpr);

          const lightC = document.createElement('canvas');
          lightC.width = canvasRef.current.width;
          lightC.height = canvasRef.current.height;

          gfx.current = {
            ctx: canvasRef.current.getContext('2d'),
            lightCanvas: lightC,
            lightCtx: lightC.getContext('2d'),
            W,
            H,
            dpr
          };

          gfx.current.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          gfx.current.lightCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };

        handleResize();
        window.addEventListener('resize', handleResize);

        let lastTime = performance.now();
        let animId;

        const loop = (now) => {
          const dt = Math.min(0.035, (now - lastTime) / 1000);
          lastTime = now;
          update(dt);
          draw();
          animId = requestAnimationFrame(loop);
        };

        animId = requestAnimationFrame(loop);

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('keydown', onKeyDown);
          window.removeEventListener('keyup', onKeyUp);
          window.removeEventListener('resize', handleResize);
          if (eng.current.audioCtx) {
            try { eng.current.audioCtx.close(); } catch (err) {}
          }
        };
      }, []);

      // Keyboard navigation for tutorial
      useEffect(() => {
        if (!showTutorial) return;
        const handleTutKeys = (e) => {
          if (e.key === 'ArrowRight' || e.key === 'Enter') {
            e.preventDefault();
            e.stopImmediatePropagation();
            if (tutorialIndex === TUTORIAL_SCREENS.length - 1) {
              setShowTutorial(false);
            } else {
              setTutorialIndex(i => i + 1);
            }
          } else if (e.key === 'ArrowLeft' && tutorialIndex > 0) {
            e.preventDefault();
            e.stopImmediatePropagation();
            setTutorialIndex(i => i - 1);
          } else if (e.key === 'Escape') {
            e.preventDefault();
            e.stopImmediatePropagation();
            setShowTutorial(false);
          }
        };
        window.addEventListener('keydown', handleTutKeys, true);
        return () => window.removeEventListener('keydown', handleTutKeys, true);
      }, [showTutorial, tutorialIndex]);

      // Touch handlers
      const joyPid = useRef(null);
      const joyTrack = (clientX, clientY) => {
        if (!joyRef.current) return;
        const r = joyRef.current.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        let dx = clientX - cx, dy = clientY - cy;
        const d = Math.hypot(dx, dy) || 1, m = 40, s = Math.min(m, d);
        dx = (dx / d) * s; dy = (dy / d) * s;
        eng.current.joy = { x: dx / m, y: dy / m };
        setNubPos({ x: Math.round(dx), y: Math.round(dy) });
      };

      const currTut = TUTORIAL_SCREENS[tutorialIndex];
      const isFinalTut = tutorialIndex === TUTORIAL_SCREENS.length - 1;

      return (
        <div style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden' }}>
          <canvas ref={canvasRef} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', display: 'block', touchAction: 'none' }} />

          {/* HUD Overlay */}
          <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
            {/* Top Left: Header & Objectives */}
            <div style={{ position: 'absolute', left: 16, top: 16, maxWidth: 'min(340px, 50vw)', padding: '13px 15px', background: 'rgba(9,11,13,0.85)', border: '1px solid rgba(198,113,57,0.5)', borderRadius: 16, boxShadow: '0 10px 30px rgba(0,0,0,0.4)' }}>
              <div style={{ fontFamily: 'Caprasimo, Georgia, serif', fontSize: 15, letterSpacing: '0.02em', color: '#e8a45c', lineHeight: 1.2 }}>Stage 1 — The God in Exile</div>
              <div style={{ marginTop: 4, fontSize: 11, letterSpacing: '0.12em', color: '#96a08f' }}>SRIRANGAM · 1323 CE (2.5D)</div>
              <div style={{ marginTop: 9, fontSize: 13, lineHeight: 1.5, color: '#f0e2c4' }}>{objective}</div>
              <div style={{ display: 'flex', gap: 7, marginTop: 11 }}>
                {stealth ? (
                  <div style={{ padding: '4px 11px', borderRadius: 999, fontSize: 10, letterSpacing: '0.14em', color: '#c8d6ae', border: '1px solid rgba(122,138,94,0.75)', background: 'rgba(122,138,94,0.24)' }}>FLAME CUPPED</div>
                ) : (
                  <div style={{ padding: '4px 11px', borderRadius: 999, fontSize: 10, letterSpacing: '0.14em', color: '#f3c078', border: '1px solid rgba(198,113,57,0.7)', background: 'rgba(198,113,57,0.24)' }}>FLAME OPEN — VISIBLE</div>
                )}
              </div>
            </div>

            {/* Bottom Left: Gauge Meters */}
            <div style={{ position: 'absolute', left: 16, bottom: 16, width: 'min(286px, 58vw)', padding: '12px 14px', background: 'rgba(9,11,13,0.85)', border: '1px solid rgba(198,113,57,0.5)', borderRadius: 16, boxShadow: '0 10px 30px rgba(0,0,0,0.4)' }}>
              <div style={{ display: 'grid', gridTemplateColumns: '70px 1fr 40px', gap: 9, alignItems: 'center', fontSize: 10, letterSpacing: '0.1em', color: '#b8ae96' }}>
                <span>FLAME</span>
                <div style={{ height: 9, borderRadius: 999, background: 'rgba(255,255,255,0.07)', overflow: 'hidden' }}>
                  <div style={{ height: '100%', borderRadius: 999, background: 'linear-gradient(90deg,#c67139,#f3c078)', width: `${Math.round(flame)}%`, transition: 'width 0.2s linear' }} />
                </div>
                <span style={{ textAlign: 'right', color: '#f3c078' }}>{Math.ceil(flame)}%</span>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '70px 1fr 40px', gap: 9, alignItems: 'center', marginTop: 9, fontSize: 10, letterSpacing: '0.1em', color: '#b8ae96' }}>
                <span>MEMORY</span>
                <div style={{ height: 9, borderRadius: 999, background: 'rgba(255,255,255,0.07)', overflow: 'hidden' }}>
                  <div style={{ height: '100%', borderRadius: 999, background: 'linear-gradient(90deg,#7a8a5e,#c8d6ae)', width: `${Math.round(memory)}%`, transition: 'width 0.2s linear' }} />
                </div>
                <span style={{ textAlign: 'right', color: '#c8d6ae' }}>{Math.ceil(memory)}%</span>
              </div>
              {!isTouch && (
                <div style={{ marginTop: 11, fontSize: 10, lineHeight: 1.6, color: '#8b8471' }}>
                  WASD / arrows to move · hold Shift to cup the flame · C to lock
                </div>
              )}
            </div>

            {/* Top Right: Source Link & Sound Controls */}
            <div style={{ position: 'absolute', right: 16, top: 16, display: 'flex', alignItems: 'center', gap: 8 }}>
              <button
                onClick={() => { setShowTutorial(true); setTutorialIndex(0); }}
                style={{
                  pointerEvents: 'auto',
                  padding: '8px 14px',
                  borderRadius: 999,
                  fontSize: 10,
                  letterSpacing: '0.12em',
                  color: '#e8a45c',
                  background: 'rgba(9,11,13,0.85)',
                  border: '1px solid rgba(198,113,57,0.5)',
                  boxShadow: '0 4px 12px rgba(0,0,0,0.3)'
                }}
              >
                HOW TO PLAY
              </button>
              <a
                href="https://selfdrivingmind.substack.com/p/they-stole-the-god-first-then-came?r=6gle0t"
                target="_blank"
                rel="noopener noreferrer"
                style={{
                  pointerEvents: 'auto',
                  textDecoration: 'none',
                  padding: '8px 14px',
                  borderRadius: 999,
                  fontSize: 10,
                  letterSpacing: '0.12em',
                  color: '#c8d6ae',
                  background: 'rgba(9,11,13,0.85)',
                  border: '1px solid rgba(122,138,94,0.6)',
                  boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
                  display: 'inline-flex',
                  alignItems: 'center'
                }}
              >
                READ SOURCE ↗
              </a>
              <button
                onClick={toggleSound}
                style={{
                  pointerEvents: 'auto',
                  padding: '8px 14px',
                  borderRadius: 999,
                  fontSize: 10,
                  letterSpacing: '0.12em',
                  color: '#f3c078',
                  background: 'rgba(9,11,13,0.85)',
                  border: '1px solid rgba(198,113,57,0.5)',
                  boxShadow: '0 4px 12px rgba(0,0,0,0.3)'
                }}
              >
                {soundOn ? 'SOUND ON' : 'SOUND OFF'}
              </button>
            </div>

            {/* Toast Notifications */}
            {messageOn && (
              <div style={{ position: 'absolute', left: '50%', top: '13%', transform: 'translateX(-50%)', maxWidth: '70vw', padding: '11px 20px', borderRadius: 999, textAlign: 'center', fontSize: 14, color: '#f7ecd4', background: 'rgba(9,11,13,0.92)', border: '1px solid rgba(198,113,57,0.55)', animation: 'vij-rise 0.25s ease both' }}>
                {message}
              </div>
            )}

            {/* Mobile Touch Controls */}
            {isTouch && (
              <div style={{ position: 'absolute', inset: 0 }}>
                <div
                  ref={joyRef}
                  onPointerDown={(e) => { ensureAudio(); joyPid.current = e.pointerId; e.target.setPointerCapture(e.pointerId); joyTrack(e.clientX, e.clientY); }}
                  onPointerMove={(e) => { if (e.pointerId === joyPid.current) joyTrack(e.clientX, e.clientY); }}
                  onPointerUp={(e) => { if (e.pointerId === joyPid.current) { joyPid.current = null; eng.current.joy = { x: 0, y: 0 }; setNubPos({ x: 0, y: 0 }); } }}
                  onPointerCancel={() => { joyPid.current = null; eng.current.joy = { x: 0, y: 0 }; setNubPos({ x: 0, y: 0 }); }}
                  style={{ pointerEvents: 'auto', position: 'absolute', left: 22, bottom: 150, width: 122, height: 122, borderRadius: '50%', border: '1px solid rgba(243,192,120,0.32)', background: 'rgba(0,0,0,0.22)' }}
                >
                  <div style={{ position: 'absolute', left: 43, top: 43, width: 36, height: 36, borderRadius: '50%', background: 'rgba(198,113,57,0.8)', transform: `translate(${nubPos.x}px, ${nubPos.y}px)` }} />
                </div>
                <button
                  onPointerDown={() => { eng.current.cupTouch = true; }}
                  onPointerUp={() => { eng.current.cupTouch = false; }}
                  onPointerCancel={() => { eng.current.cupTouch = false; }}
                  style={{ pointerEvents: 'auto', position: 'absolute', right: 24, bottom: 158, width: 92, height: 92, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center', fontSize: 11, letterSpacing: '0.1em', color: '#f3c078', border: '1px solid rgba(243,192,120,0.45)', background: 'rgba(24,18,11,0.6)' }}
                >
                  CUP<br />FLAME
                </button>
              </div>
            )}
          </div>

          {/* Intro Dialogue Screen */}
          {phase === 'intro' && (
            <div style={{ position: 'absolute', inset: 0, zIndex: 20, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, background: 'radial-gradient(circle at 50% 28%, rgba(198,113,57,0.22), rgba(4,5,6,0.97) 62%)' }}>
              <div style={{ width: 'min(700px,100%)', padding: '38px 40px', borderRadius: 24, background: 'rgba(9,11,13,0.94)', border: '1px solid rgba(198,113,57,0.55)', boxShadow: '0 24px 70px rgba(0,0,0,0.6)', animation: 'vij-rise 0.4s ease both' }}>
                <div style={{ fontSize: 11, letterSpacing: '0.2em', color: '#96a08f' }}>VIJAYANAGARA · THE EXILED GOD</div>
                <div style={{ marginTop: 10, fontFamily: 'Caprasimo, Georgia, serif', fontSize: 38, lineHeight: 1.1, color: '#e8a45c' }}>Stage 1 — The God in Exile</div>
                <div style={{ marginTop: 18, fontSize: 15, lineHeight: 1.75, color: '#e4d8bf', maxWidth: 560 }}>
                  The Sultanate's riders are inside the walls. You are a temple custodian carrying Sri Namperumal — the processional form of Sri Ranganatha — out through the courtyards toward the south gate in 2.5D isometric view.
                </div>
                <div style={{ marginTop: 14, fontSize: 15, lineHeight: 1.75, color: '#b8ae96', maxWidth: 560 }}>
                  Your lamp is both your sight and your betrayal. Held open it shows the way and carries far into the dark. Cupped in your palm you move slowly, unseen. Four lamp shrines will refill it.
                </div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 11, marginTop: 28 }}>
                  <button onClick={() => beginStage('Pilgrim')} style={{ padding: '13px 24px', borderRadius: 999, fontSize: 13, color: '#f0e2c4', border: '1px solid rgba(255,255,255,0.22)' }}>PILGRIM · forgiving</button>
                  <button onClick={() => beginStage('Custodian')} style={{ padding: '13px 26px', borderRadius: 999, fontSize: 13, fontWeight: 700, color: '#1a1207', background: '#c67139', border: '1px solid #c67139' }}>BEGIN THE EXODUS</button>
                  <button onClick={() => beginStage('Guardian')} style={{ padding: '13px 24px', borderRadius: 999, fontSize: 13, color: '#f0e2c4', border: '1px solid rgba(255,255,255,0.22)' }}>GUARDIAN · unforgiving</button>
                </div>
                {hasCheckpoint && (
                  <button onClick={() => beginStage(eng.current.checkpoint.diff || 'Custodian', true)} style={{ display: 'inline-block', marginTop: 16, fontSize: 12, letterSpacing: '0.1em', color: '#c8d6ae', borderBottom: '1px solid rgba(200,214,174,0.4)' }}>
                    ↺ RESUME FROM {checkpointLabel}
                  </button>
                )}

                {/* Attribution on Intro Screen */}
                <div style={{ marginTop: 26, paddingTop: 18, borderTop: '1px solid rgba(255,255,255,0.1)', fontSize: 12, lineHeight: 1.7, color: '#8b8471' }}>
                  Based on the historical chronicle{' '}
                  <a
                    href="https://selfdrivingmind.substack.com/p/they-stole-the-god-first-then-came?r=6gle0t"
                    target="_blank"
                    rel="noopener noreferrer"
                    style={{ color: '#c8d6ae', borderBottom: '1px solid rgba(200,214,174,0.45)' }}
                  >
                    They Stole the God First, Then Came for the Land ↗
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* End Game Dialogue Screen */}
          {phase === 'end' && (
            <div style={{ position: 'absolute', inset: 0, zIndex: 20, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, background: 'radial-gradient(circle at 50% 32%, rgba(198,113,57,0.2), rgba(4,5,6,0.97) 62%)' }}>
              <div style={{ width: 'min(640px,100%)', padding: '36px 40px', borderRadius: 24, background: 'rgba(9,11,13,0.95)', border: '1px solid rgba(198,113,57,0.55)', boxShadow: '0 24px 70px rgba(0,0,0,0.6)', animation: 'vij-rise 0.4s ease both' }}>
                <div style={{ fontSize: 11, letterSpacing: '0.2em', color: '#96a08f' }}>{endState.kicker}</div>
                <div style={{ marginTop: 10, fontFamily: 'Caprasimo, Georgia, serif', fontSize: 34, lineHeight: 1.15, color: '#e8a45c' }}>{endState.title}</div>
                <div style={{ marginTop: 16, fontSize: 15, lineHeight: 1.75, color: '#e4d8bf', maxWidth: 520 }}>{endState.body}</div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 11, marginTop: 26 }}>
                  <button onClick={() => { setPhase('intro'); eng.current.playing = false; resetGame(false); }} style={{ padding: '13px 26px', borderRadius: 999, fontSize: 13, fontWeight: 700, color: '#1a1207', background: '#c67139', border: '1px solid #c67139' }}>{endState.action}</button>
                  {!won && hasCheckpoint && (
                    <button onClick={() => beginStage(eng.current.checkpoint.diff || 'Custodian', true)} style={{ padding: '13px 24px', borderRadius: 999, fontSize: 13, color: '#f0e2c4', border: '1px solid rgba(255,255,255,0.22)' }}>
                      RESUME FROM {checkpointLabel}
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ChatGPT 5-Step Tutorial Modal Overlay */}
          {showTutorial && (
            <div id="vij-tutorial" role="dialog" aria-modal="true" aria-label="Stage 1 tutorial">
              <div className="vt-card">
                <div className="vt-eyebrow">Vijayanagara · The Exiled God</div>
                <div className="vt-step">Tutorial {tutorialIndex + 1} of {TUTORIAL_SCREENS.length}</div>
                <h2>{currTut.title}</h2>
                <div dangerouslySetInnerHTML={{ __html: currTut.body }} />
                <div className="vt-visual" dangerouslySetInnerHTML={{ __html: currTut.visual }} />
                {currTut.note && <p className="vt-note">{currTut.note}</p>}
                
                <div className="vt-progress">
                  {TUTORIAL_SCREENS.map((_, i) => (
                    <span key={i} className={`vt-dot ${i === tutorialIndex ? 'on' : ''}`} />
                  ))}
                </div>

                <div className="vt-actions">
                  {tutorialIndex > 0 && (
                    <button type="button" className="secondary" onClick={() => setTutorialIndex(i => i - 1)}>BACK</button>
                  )}
                  <button
                    type="button"
                    onClick={() => {
                      if (isFinalTut) setShowTutorial(false);
                      else setTutorialIndex(i => i + 1);
                    }}
                  >
                    {isFinalTut ? 'CHOOSE LEVEL & BEGIN' : 'NEXT'}
                  </button>
                  {!isFinalTut && (
                    <button type="button" className="secondary" onClick={() => setShowTutorial(false)}>SKIP TUTORIAL</button>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<VijayanagaraStage1 />);
  </script>
</body>
</html>
