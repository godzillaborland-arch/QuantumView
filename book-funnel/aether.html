<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#24213c">
<title>Aether Breath — a quiet place to return</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#f3eee9;background:#24213c}
#sky{position:fixed;inset:-20%;background:radial-gradient(ellipse at 25% 30%,#9485bc88,transparent 55%),radial-gradient(ellipse at 80% 65%,#7bc4be77,transparent 55%),radial-gradient(ellipse at 50% 100%,#deb98655,transparent 50%),#24213c;animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:rotate(12deg) scale(1.1);filter:hue-rotate(25deg)}}
#stage{position:fixed;inset:0;touch-action:none;outline:none}canvas{display:block;width:100%;height:100%}
header{position:absolute;top:32px;left:38px;right:38px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.brand{font-size:13px;letter-spacing:4px;font-weight:500}.subtitle{font-size:10px;letter-spacing:2px;opacity:.45;margin-top:9px}
.stats{text-align:right;font-size:11px;letter-spacing:1px;color:#ffffff90}.stats b{font-weight:400;font-size:24px;color:#efe8d8;display:block;margin-bottom:4px}
#guide{position:absolute;top:19%;left:0;width:100%;text-align:center;pointer-events:none}
#phase{font-size:clamp(28px,5vw,42px);font-weight:300;letter-spacing:2px;margin:0 0 9px}#instruction{font-size:12px;letter-spacing:1px;opacity:.65}
#clock{display:block;font-size:13px;font-variant-numeric:tabular-nums;opacity:.55;margin:14px auto}
#progress{width:112px;height:2px;background:#ffffff19;margin:auto;overflow:hidden}#fill{height:100%;width:0;background:#eee1c5a0}
#bottom{position:absolute;bottom:30px;left:24px;right:24px;text-align:center}
#feedback{font-size:12px;color:#ece4d7b0;min-height:19px;letter-spacing:.5px;margin-bottom:20px}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;color:#ede9ef;border:1px solid #ffffff25;background:#24253a77;border-radius:24px;padding:10px 15px;outline:none;font-size:11px}
button,select{cursor:pointer}button:hover{background:#ffffff18}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #d4e8dd;outline-offset:3px}
select option{background:#282940}#custom{display:none;justify-content:center;gap:10px;margin:12px 0}#custom label{font-size:10px;color:#ffffff90}input{width:52px;padding:8px;text-align:center;margin-left:4px}
.footnote{margin-top:14px;font-size:10px;letter-spacing:.7px;opacity:.38}#error{display:none;position:absolute;inset:40% 10% auto;text-align:center;background:#25243bea;padding:24px;border-radius:16px}
@media(max-width:600px){header{top:22px;left:22px;right:22px}.brand{font-size:11px;letter-spacing:3px}#guide{top:18%}#bottom{bottom:20px}.subtitle{font-size:8px}.controls{gap:6px}button,select{padding:10px 12px}}
@media(prefers-reduced-motion:reduce){#sky{animation:none}}
</style>
</head>
<body>
<div id="sky"></div>
<main id="stage" tabindex="0" aria-label="Breathing flower. Hold Space or press and hold here to inhale; release to exhale."></main>
<header><div><div class="brand">AETHER BREATH</div><div class="subtitle">A QUIET PLACE TO RETURN</div></div><div class="stats"><b id="streak">0</b>mindful streak<span id="cycles" style="display:block;margin-top:8px;opacity:.5">0 harmonious cycles</span></div></header>
<section id="guide" aria-label="Breathing guide"><h1 id="phase">Begin with a breath</h1><div id="instruction">Hold Space or the flower to inhale</div><span id="clock">4 · 7 · 8</span><div id="progress"><div id="fill"></div></div></section>
<footer id="bottom"><div id="feedback" role="status" aria-live="polite">No rush. Find a comfortable rhythm.</div><div class="controls">
<select id="rhythm" aria-label="Breathing rhythm"><option value="478">4–7–8 breathing</option><option value="box">Box · 4–4–4–4</option><option value="custom">Custom box rhythm</option></select>
<button id="sound" aria-pressed="false">Sound off</button><button id="pause">Pause</button><button id="reset">Begin again</button>
</div><div id="custom"><label>In<input id="in" type="number" min="1" max="12" value="4"></label><label>Hold<input id="hold" type="number" min="1" max="12" value="4"></label><label>Out<input id="out" type="number" min="1" max="12" value="4"></label><label>Rest<input id="rest" type="number" min="1" max="12" value="4"></label></div>
<div class="footnote">HOLD TO INHALE · RELEASE TO EXHALE · BREATHE COMFORTABLY</div></footer>
<div id="error" role="alert"></div>
<script type="module">
// One CDN dependency; all geometry, textures, interaction and audio are procedural.
const $=id=>document.getElementById(id);
let THREE;
try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');}
catch(e){$('error').style.display='block';$('error').textContent='The flower could not load. Please connect to the internet and reload.';}
if(THREE){
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});}
catch(e){$('error').style.display='block';$('error').textContent='WebGL is unavailable. Please try a browser with hardware acceleration enabled.';}
if(renderer){
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setClearColor(0,0);
$('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.1,80);
camera.position.set(0,5.4,10.5);camera.lookAt(0,0,0);
const lotus=new THREE.Group();scene.add(lotus);
const petals=[];
// Faceted, curved petals: a shared topology with three translucent whorls.
function petalGeometry(length,width,lift){
 const g=new THREE.BufferGeometry();
 const vertices=[0,0,0,-width*.7,lift*.25,length*.34,width*.7,lift*.25,length*.34,
 -width,lift*.7,length*.65,width,lift*.7,length*.65,0,lift,length,
 0,lift*.5+.18,length*.5,0,lift*.45-.12,length*.5];
 g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
 g.setIndex([0,1,6,0,6,2,1,3,6,2,6,4,3,5,6,4,6,5,0,7,1,0,2,7,1,7,3,2,4,7,3,7,5,4,5,7]);
 g.computeVertexNormals();return g;
}
const colors=[0xc9eee5,0xd3bbef,0xf3d9a7];
for(let layer=0;layer<3;layer++){
 const count=layer===2?8:12,g=petalGeometry(2.8-layer*.6,.66-layer*.10,.6+layer*.4);
 const face=new THREE.MeshBasicMaterial({color:colors[layer],transparent:true,opacity:.065,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending});
 const wire=new THREE.LineBasicMaterial({color:colors[layer],transparent:true,opacity:.44,depthWrite:false,blending:THREE.AdditiveBlending});
 const edges=new THREE.EdgesGeometry(g,1);
 for(let i=0;i<count;i++){
  const p=new THREE.Group();p.rotation.y=i/count*Math.PI*2+layer*.26;p.position.y=layer*.08;
  p.add(new THREE.Mesh(g,face),new THREE.LineSegments(edges,wire));lotus.add(p);petals.push({p,layer});
 }
}
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.36,0),new THREE.MeshBasicMaterial({color:0xffedca,wireframe:true,transparent:true,opacity:.7}));
core.position.y=.45;lotus.add(core);
const rings=new THREE.Group();scene.add(rings);
for(let i=0;i<3;i++){
 const ring=new THREE.Mesh(new THREE.TorusGeometry(2.7+i*.28,.006,3,100),new THREE.MeshBasicMaterial({color:0xc9e6df,transparent:true,opacity:.16,depthWrite:false}));
 ring.rotation.x=Math.PI/2;ring.position.y=-.3-i*.02;rings.add(ring);
}
// Soft halo and point-sprite texture, generated locally rather than downloaded.
const textureCanvas=document.createElement('canvas');textureCanvas.width=textureCanvas.height=64;
const tc=textureCanvas.getContext('2d'),gradient=tc.createRadialGradient(32,32,0,32,32,32);
gradient.addColorStop(0,'rgba(255,250,229,1)');gradient.addColorStop(.15,'rgba(242,241,225,.65)');gradient.addColorStop(1,'rgba(220,241,232,0)');tc.fillStyle=gradient;tc.fillRect(0,0,64,64);
const texture=new THREE.CanvasTexture(textureCanvas);
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,color:0xbcb0e4,transparent:true,opacity:.20,depthWrite:false,blending:THREE.AdditiveBlending}));
halo.scale.set(7,7,1);halo.position.y=.2;scene.add(halo);
const count=650,positions=new Float32Array(count*3),seeds=[];
for(let i=0;i<count;i++)seeds.push({r:1.4+Math.random()*6,a:Math.random()*Math.PI*2,y:(Math.random()-.5)*3.4,s:.12+Math.random()*.25});
const particleGeometry=new THREE.BufferGeometry();particleGeometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
scene.add(new THREE.Points(particleGeometry,new THREE.PointsMaterial({map:texture,color:0xece0e8,size:.055,transparent:true,opacity:.65,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true})));
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;const fit=Math.max(1,.95/camera.aspect);camera.position.set(0,5.4*fit,10.5*fit);camera.lookAt(0,0,0);camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

// The guide advances on real elapsed time; input controls the flower independently.
let durations=[4,7,8,0],phaseIndex=0,elapsed=0,started=false,paused=false;
let keyHeld=false,pointerHeld=false,pointerId=null,scale=.76,streak=0,cycles=0;
let goodTime=0,totalTime=0,sawIn=false,sawOut=false,last=performance.now(),visualTime=0;
const names=['Inhale','Hold gently','Exhale','Rest'];
const cues=['Press and hold · let the flower open','Keep holding · soften your shoulders','Release · let the flower settle','Stay released · rest in the stillness'];
const held=()=>keyHeld||pointerHeld;
function feedback(text){$('feedback').textContent=text;}
function clearInput(){keyHeld=false;pointerHeld=false;pointerId=null;}
function begin(){if(!started&&!paused){started=true;phaseIndex=0;elapsed=0;feedback('Follow the light. Let your breath stay easy.');}}
function restart(){clearInput();started=false;paused=false;phaseIndex=0;elapsed=0;streak=0;cycles=0;goodTime=totalTime=0;sawIn=sawOut=false;$('pause').textContent='Pause';updateStats();feedback('No rush. Find a comfortable rhythm.');}
function updateStats(){$('streak').textContent=streak;$('cycles').textContent=`${cycles} harmonious cycle${cycles===1?'':'s'}`;}
function completeCycle(){
 if(totalTime>0&&goodTime/totalTime>=.82&&sawIn&&sawOut){streak++;cycles++;feedback(['A little more space. A little more stillness.','A harmonious breath. Return gently.','Nothing to chase. Just this breath.'][cycles%3]);chime();}
 else{streak=0;feedback('A fresh breath awaits. Follow the next inhale.');}
 updateStats();goodTime=totalTime=0;sawIn=sawOut=false;
}
function advance(dt){
 // Split at phase boundaries so scoring stays accurate across frame delays.
 while(dt>0){
  const step=Math.min(dt,durations[phaseIndex]-elapsed),expectHeld=phaseIndex<2;
  totalTime+=step;if(held()===expectHeld)goodTime+=step;
  if(phaseIndex===0&&held())sawIn=true;if(phaseIndex===2&&!held())sawOut=true;
  elapsed+=step;dt-=step;
  if(elapsed>=durations[phaseIndex]-.000001){elapsed=0;phaseIndex++;if(phaseIndex===3&&!durations[3])phaseIndex=4;if(phaseIndex===4){completeCycle();phaseIndex=0;}}
 }
}
function changeRhythm(){
 const mode=$('rhythm').value;$('custom').style.display=mode==='custom'?'flex':'none';
 durations=mode==='478'?[4,7,8,0]:mode==='box'?[4,4,4,4]:['in','hold','out','rest'].map(id=>{const n=Math.round(Number($(id).value)||4),v=Math.max(1,Math.min(12,n));$(id).value=v;return v;});
 restart();
}
$('rhythm').addEventListener('change',changeRhythm);
['in','hold','out','rest'].forEach(id=>$(id).addEventListener('change',changeRhythm));
$('reset').onclick=restart;
$('pause').onclick=()=>{paused=!paused;clearInput();$('pause').textContent=paused?'Resume':'Pause';feedback(paused?'Take all the time you need.':'Return on the next gentle cue.');};
// Mouse, touch and Space work without capturing interactions with the controls.
$('stage').addEventListener('pointerdown',e=>{if(e.button!==0||paused||pointerId!==null)return;e.preventDefault();$('stage').focus({preventScroll:true});pointerId=e.pointerId;$('stage').setPointerCapture(e.pointerId);pointerHeld=true;begin();resumeAudio();});
function releasePointer(e){if(e.pointerId===pointerId){pointerHeld=false;pointerId=null;}}
$('stage').addEventListener('pointerup',releasePointer);$('stage').addEventListener('pointercancel',releasePointer);$('stage').addEventListener('lostpointercapture',releasePointer);
addEventListener('keydown',e=>{if(e.code!=='Space'||/INPUT|SELECT/.test(e.target.tagName))return;e.preventDefault();if(paused)return;keyHeld=true;begin();resumeAudio();},true);
addEventListener('keyup',e=>{if(e.code==='Space'){keyHeld=false;if(!/INPUT|SELECT/.test(e.target.tagName))e.preventDefault();}},true);
// Return keyboard control to the flower after choosing a rhythm.
$('rhythm').addEventListener('change',()=>$('stage').focus({preventScroll:true}));
function suspend(){clearInput();if(started&&!paused){paused=true;$('pause').textContent='Resume';feedback('Your session is paused. Return when you are ready.');}}
addEventListener('blur',suspend);document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend();last=performance.now();});

// Audio starts only after a gesture. A quiet chord changes after successful loops.
let audio=null,master=null,voices=[],soundOn=false;
function resumeAudio(){if(soundOn&&audio&&audio.state==='suspended')audio.resume().catch(()=>{});}
function createAudio(){
 const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return false;
 audio=new AudioContext();master=audio.createGain();master.gain.value=0;master.connect(audio.destination);
 [130.81,196,261.63].forEach(f=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(master);o.start();voices.push(o);});return true;
}
$('sound').onclick=()=>{
 try{if(!audio&&!createAudio()){feedback('Audio is unavailable in this browser.');return;}soundOn=!soundOn;resumeAudio();$('sound').textContent=soundOn?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',String(soundOn));master.gain.setTargetAtTime(soundOn?.65:0,audio.currentTime,.3);}
 catch(e){feedback('Audio is unavailable. You can keep breathing with the flower.');}
};
function chime(){
 if(!audio||!soundOn)return;const t=audio.currentTime;
 const root=[130.81,146.83,164.81,146.83][cycles%4];voices.forEach((o,i)=>o.frequency.setTargetAtTime(root*[1,1.5,2][i],t,1.4));
 const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=root*4;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+3);o.connect(g);g.connect(master);o.start(t);o.stop(t+3.1);o.onended=()=>{o.disconnect();g.disconnect();};
}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastText='';
function frame(now){
 const dt=Math.min((now-last)/1000,.1);last=now;
 if(!paused){visualTime+=dt;if(started)advance(dt);}
 const active=started&&!paused,target=held()?1.17:.76;
 if(!paused)scale+=(target-scale)*(1-Math.exp(-dt*.8));
 lotus.scale.setScalar(scale);lotus.rotation.y=reduced?0:visualTime*.045;
 petals.forEach(({p,layer})=>p.rotation.x=(scale-.76)*(-.24-layer*.08));
 core.rotation.y=visualTime*.15;core.rotation.z=visualTime*.1;
 halo.material.opacity=.13+(scale-.76)*.22;rings.scale.setScalar(.94+scale*.08);
 for(let i=0;i<count;i++){
  const s=seeds[i];if(!paused){s.r+=(held()?-.6:.36)*dt*s.s*2;if(s.r<.65)s.r=7;if(s.r>7)s.r=.65;s.a+=dt*.025;}
  positions[i*3]=Math.cos(s.a)*s.r;positions[i*3+1]=s.y+Math.sin(visualTime*.3+s.a)*.15;positions[i*3+2]=Math.sin(s.a)*s.r;
 }
 particleGeometry.attributes.position.needsUpdate=true;
 const text=paused?'A moment of stillness':started?names[phaseIndex]:'Begin with a breath';
 if(text!==lastText){$('phase').textContent=text;$('instruction').textContent=paused?'Resume whenever you are ready':started?cues[phaseIndex]:'Hold Space or the flower to inhale';lastText=text;}
 $('clock').textContent=active?`${Math.ceil(durations[phaseIndex]-elapsed)} s`:durations.filter(Boolean).join(' · ');
 $('fill').style.width=started?`${elapsed/durations[phaseIndex]*100}%`:'0%';
 if(audio&&soundOn){master.gain.setTargetAtTime(paused?.12:.48+(scale-.76)*.35,audio.currentTime,.5);}
 renderer.render(scene,camera);requestAnimationFrame(frame);
}
renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();suspend();$('error').style.display='block';$('error').textContent='The graphics connection was interrupted. Reload to return to the flower.';});
requestAnimationFrame(frame);
}
}
</script>
</body>
</html>
